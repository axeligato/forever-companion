button{color:#aeb9c7;border:0;background:transparent;text-shadow:none}.nav button.active{color:#ffe0a0;background:linear-gradient(#3a3428,#242b34);box-shadow:inset 0 0 0 1px #82683f}.progress{background:#18212e}.progress span{background:linear-gradient(90deg,#8b662c,#f4d18d)}.item{border-color:#484335}.check{accent-color:#e3bc73}.empty{border-color:#685537}.disclaimer{font-size:11px;color:#9ba7b4;margin-top:14px}.brand-crest img{width:34px;height:34px;object-fit:contain}@media(max-width:360px){.brand-name{font-size:20px}.shell{padding-left:14px;padding-right:14px}.nav button{font-size:11px}}
</style></head><body><main class="shell"><header class="brand"><div class="brand-crest" aria-hidden="true">⚔</div><div><div class="brand-name">FOREVER <span style="color:#fff2cc">COMPANION</span></div><div class="brand-sub">WoW Forever · Unofficial player toolkit</div></div></header><div id="app"></div><div class="disclaimer">Unofficial fan-made companion. Not affiliated with or endorsed by Blizzard Entertainment.</div></main><nav class="nav" aria-label="Main navigation"><div class="nav-inner" id="nav"></div></nav><script>
const KEY='forever-companion-v1';const defaults={name:'My Champion',class:'Paladin',spec:'Protection',level:38,profession:'Blacksmithing',skill:185,goals:[{id:1,text:'Browse Forever blacksmithing patterns',done:false},{id:2,text:'Collect materials for next upgrade',done:false}],gear:[],saved:[],learned:[],favor:0,faction:'Alliance'};let state;try{state={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state={...defaults}}let tab='home',filter='',craftView='all';const families=['Acolyte\'s','Crusader\'s','Guard\'s','Protector\'s','Veteran\'s'];const tiers=[['Chain Belt',45,30],['Gloves',80,30],['Boots',85,30],['Silvered Chain Helm',95,30],['Silvered Chain Shirt',110,30],['Silvered Chain Leggings',125,30]];const plates=['Justicar\'s','Officer\'s','Prefect\'s','Sentinel\'s','Warder\'s'];const plateTiers=[['Gauntlet',175,60],['Pauldrons',210,60],['Wristguard',225,90],['Sabatons',240,90],['Waistguard',250,90]];const recipes=[...tiers.flatMap(([slot,skill,favor])=>families.map(f=>({id:'bs-'+f+'-'+slot,name:f+' '+slot,profession:'Blacksmithing',skill,favor,vendor:'Stondry Darkhammer / Gor\'mak',recommend:f==='Protector\'s'?'Protection Paladin candidate':null}))),...plateTiers.flatMap(([slot,skill,favor])=>plates.map(f=>({id:'bs-'+f+'-'+slot,name:f+' '+(f==='Justicar\'s'&&slot==='Wristguard'?'Wristguards':slot),profession:'Blacksmithing',skill,favor,vendor:'Stondry Darkhammer / Gor\'mak',recommend:f==='Justicar\'s'?'Compare for tank build':null}))),...['Thorium Cestus','Thorium Greatmace'].map(name=>({id:'bs-'+name,name,profession:'Blacksmithing',skill:250,favor:90})),...['Enriched Thorium Breastplate','Enriched Thorium Helm','Enriched Thorium Leggings','Legionite Glaive'].map(name=>({id:'bs-'+name,name,profession:'Blacksmithing',skill:300,favor:120}))];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const el=id=>document.getElementById(id);const icon={home:'⌂',craft:'⚒',gear:'◇',goals:'☑'};function render(){el('nav').innerHTML=Object.entries(icon).map(([k,v])=>'<button class="'+(tab===k?'active':'')+'" data-tab="'+k+'"><span>'+v+'</span>'+k[0].toUpperCase()+k.slice(1)+'</button>').join('');let content=tab==='home'?home():tab==='craft'?craft():tab==='gear'?gear():goals();el('app').innerHTML='<div class="eyebrow">Forever Companion · V1</div>'+content+'<footer>Unofficial fan-made companion · Not affiliated with Blizzard or WoW Forever</footer>';document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});bind()}
function home(){const completed=state.goals.filter(x=>x.done).length;return '<h1>Ready for Azeroth?</h1><p>Your progress, priorities and next purchases in one place.</p><section class="card hero"><div class="row"><div><span class="pill">'+esc(state.spec)+' '+esc(state.class)+'</span><h2 style="font-family:Georgia,serif;font-size:25px;margin:15px 0 5px">'+esc(state.name)+'</h2><span class="muted">Level '+esc(state.level)+' · '+esc(state.profession)+'</span></div><div style="font-size:52px;color:#f1c778;text-shadow:0 0 24px #d5a64a55">⚔</div></div></section><div class="grid"><div class="stat"><span class="muted">Profession skill</span><b>'+esc(state.skill)+'</b></div><div class="stat"><span class="muted">Goals complete</span><b>'+completed+' / '+state.goals.length+'</b></div></div><h2>Your character</h2><div class="card"><div class="grid"><label>Faction<select id="faction"><option '+(state.faction==='Alliance'?'selected':'')+'>Alliance</option><option '+(state.faction==='Horde'?'selected':'')+'>Horde</option></select></label><label>Character name<input id="name" maxlength="40" value="'+esc(state.name)+'"></label><label>Level<input id="level" type="number" min="1" max="100" value="'+esc(state.level)+'"></label><label>Class<select id="class">'+['Paladin','Warrior','Druid','Shaman','Hunter','Rogue','Mage','Priest','Warlock'].map(x=>'<option '+(x===state.class?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label>Specialization<input id="spec" maxlength="40" value="'+esc(state.spec)+'"></label><label>Profession<select id="profession">'+['Blacksmithing','Alchemy','Engineering','Leatherworking','Tailoring','Enchanting','Jewelcrafting','Mining','Herbalism','Skinning'].map(x=>'<option '+(x===state.profession?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label>Skill<input id="skill" type="number" min="0" max="450" value="'+esc(state.skill)+'"></label></div><p class="muted">Changes save automatically on this device.</p></div><h2>Up next</h2>'+goalItems(state.goals.slice(0,3))+'<button class="secondary" id="goGoals">See all goals →</button>'}
function craft(){const matches=recipes.filter(r=>r.profession===state.profession&&r.name.toLowerCase().includes(filter.toLowerCase())&&(craftView!=='learnable'||r.skill<=state.skill)&&(craftView!=='saved'||state.saved.includes(r.id)));const saved=recipes.filter(r=>state.saved.includes(r.id));const total=saved.filter(r=>!state.learned.includes(r.id)).reduce((n,r)=>n+r.favor,0);return '<h1>Recipe collection</h1><p>Find, plan and track your WoW Forever profession patterns.</p><div class="card"><strong>Historical vendor patterns — verify in-game</strong><p class="muted">Initial catalog based on October beta vendor observations. A 12 November live vendor report lists additional stock, so this catalog is incomplete and must not be treated as the definitive current list. Verify each pattern and price in-game. Material requirements and item stats are not yet verified.</p><a href="https://metammo.com/wow-forever/merchants-favor/stondry-darkhammer" target="_blank" rel="noopener" style="color:#e5bd78">View recipe source ↗</a></div><div class="card stack"><label>Search recipes<input id="search" placeholder="Search patterns…" value="'+esc(filter)+'"></label><label>Merchant’s Favor balance<input id="favor" type="number" min="0" value="'+esc(state.favor)+'"></label><div class="grid"><div class="stat"><span class="muted">Saved cost</span><b>'+total+'</b></div><div class="stat"><span class="muted">Favor still needed</span><b>'+Math.max(0,total-(Number(state.favor)||0))+'</b></div></div><div class="actions"><button class="'+(craftView==='all'?'':'secondary')+'" data-view="all">All</button><button class="'+(craftView==='learnable'?'':'secondary')+'" data-view="learnable">Learnable</button><button class="'+(craftView==='saved'?'':'secondary')+'" data-view="saved">Saved</button></div><div class="row"><span class="muted">Your skill: '+esc(state.skill)+'</span><span class="pill">'+saved.length+' saved</span></div></div>'+(saved.length?'<h2>Shopping list</h2>'+saved.map(r=>'<div class="item"><input class="check" type="checkbox" aria-label="Mark recipe acquired" data-learned="'+esc(r.id)+'" '+(state.learned.includes(r.id)?'checked':'')+'><div class="item-main"><strong>'+esc(r.name)+'</strong><small>'+(state.learned.includes(r.id)?'Acquired':'To buy · '+r.favor+' Favor')+'</small></div><button class="ghost" data-recipe="'+esc(r.id)+'" aria-label="Remove saved recipe">✕</button></div>').join(''):'')+'<div class="row"><h2>'+esc(state.profession)+'</h2><span class="muted">'+matches.length+' patterns</span></div>'+(matches.length?matches.map(r=>'<div class="card"><div class="row"><strong>'+esc(r.name)+'</strong><span class="pill">'+r.favor+' Favor</span></div><p class="muted">Requires Blacksmithing '+r.skill+' · '+(state.skill>=r.skill?'Skill requirement met':'Not yet learnable at your skill')+'</p>'+(r.recommend?'<p class="muted">✦ '+esc(r.recommend)+' — review exact stats in-game</p>':'')+'<div class="actions"><button class="'+(state.saved.includes(r.id)?'secondary':'')+'" data-recipe="'+esc(r.id)+'">'+(state.saved.includes(r.id)?'✓ Planned':'Add to list')+'</button><button class="secondary" data-learned-button="'+esc(r.id)+'">'+(state.learned.includes(r.id)?'✓ Acquired':'Mark acquired')+'</button></div></div>').join(''):'<div class="empty">No matching patterns for this profession yet. Only Blacksmithing has sourced data in V1.1.</div>')}function gear(){return '<h1>Gear tracker</h1><p>Keep track of items you want to craft, farm or purchase.</p><form id="gearForm" class="card stack"><label>Item name<input name="item" maxlength="90" required placeholder="e.g. A new tank shield"></label><label>Where to get it (optional)<input name="source" maxlength="120" placeholder="Dungeon, vendor, crafting…"></label><button>Add item</button></form><h2>Wishlist · '+state.gear.length+'</h2>'+(state.gear.length?state.gear.map(x=>'<div class="card row"><div class="item-main"><strong>'+esc(x.name)+'</strong><small class="muted">'+esc(x.source||'Source not specified')+' · '+(x.done?'Acquired':'Wanted')+'</small></div><button class="secondary" data-gear="'+x.id+'">'+(x.done?'Undo':'Got it')+'</button><button class="ghost" aria-label="Remove item" data-removegear="'+x.id+'">✕</button></div>').join(''):'<div class="empty">Your wishlist is empty. Add your first upgrade above.</div>')}
function goalItems(items){return items.length?'<div class="card">'+items.map(x=>'<div class="item"><input class="check" aria-label="Complete goal" type="checkbox" data-goal="'+x.id+'" '+(x.done?'checked':'')+'><div class="item-main"><strong style="'+(x.done?'text-decoration:line-through;opacity:.55':'')+'">'+esc(x.text)+'</strong></div><button class="ghost" aria-label="Delete goal" data-removegoal="'+x.id+'">✕</button></div>').join('')+'</div>':'<div class="empty">No goals yet.</div>'}
function goals(){return '<h1>Adventure journal</h1><p>Plan what matters for your next adventure.</p><form id="goalForm" class="card stack"><label>New objective<input name="goal" maxlength="120" required placeholder="e.g. Visit blacksmithing vendor"></label><button>Add objective</button></form><h2>Your checklist</h2>'+goalItems(state.goals)+'<div class="actions"><button class="secondary" id="clearDone">Clear completed</button><button class="ghost" id="export">Export backup</button></div><div class="card stack"><h2 style="margin:0">Restore your progress</h2><p class="muted">Import a previously exported Forever Companion JSON backup. This replaces your current local data.</p><input type="file" id="import" accept="application/json,.json"></div>'}
function bind(){['name','class','spec','profession','level','skill','faction'].forEach(k=>{if(el(k))el(k).onchange=e=>{state[k]=['level','skill'].includes(k)?Math.max(0,Number(e.target.value)||0):e.target.value;save();render()}});if(el('goCraft'))el('goCraft').onclick=()=>{tab='craft';render()};if(el('goGoals'))el('goGoals').onclick=()=>{tab='goals';render()};if(el('favor'))el('favor').onchange=e=>{state.favor=Math.max(0,Number(e.target.value)||0);save();render()};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{craftView=b.dataset.view;render()});if(el('search'))el('search').oninput=e=>{filter=e.target.value;const pos=e.target.selectionStart;render();el('search').focus();el('search').setSelectionRange(pos,pos)};document.querySelectorAll('[data-learned]').forEach(b=>b.onchange=()=>{const id=b.dataset.learned;state.learned=b.checked?[...new Set([...state.learned,id])]:state.learned.filter(x=>x!==id);save();render()});document.querySelectorAll('[data-learned-button]').forEach(b=>b.onclick=()=>{const id=b.dataset.learnedButton;state.learned=state.learned.includes(id)?state.learned.filter(x=>x!==id):[...state.learned,id];save();render()});document.querySelectorAll('[data-recipe]').forEach(b=>b.onclick=()=>{let id=b.dataset.recipe;state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];save();render()});if(el('gearForm'))el('gearForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);state.gear.push({id:Date.now(),name:String(f.get('item')).trim(),source:String(f.get('source')).trim(),done:false});save();render()};if(el('goalForm'))el('goalForm').onsubmit=e=>{e.preventDefault();const value=String(new FormData(e.target).get('goal')).trim();if(value){state.goals.push({id:Date.now(),text:value,done:false});save();render()}};document.querySelectorAll('[data-goal]').forEach(b=>b.onchange=()=>{const x=state.goals.find(x=>x.id==b.dataset.goal);if(x)x.done=b.checked;save();render()});document.querySelectorAll('[data-removegoal]').forEach(b=>b.onclick=()=>{state.goals=state.goals.filter(x=>x.id!=b.dataset.removegoal);save();render()});document.querySelectorAll('[data-gear]').forEach(b=>b.onclick=()=>{const x=state.gear.find(x=>x.id==b.dataset.gear);if(x)x.done=!x.done;save();render()});document.querySelectorAll('[data-removegear]').forEach(b=>b.onclick=()=>{state.gear=state.gear.filter(x=>x.id!=b.dataset.removegear);save();render()});if(el('clearDone'))el('clearDone').onclick=()=>{state.goals=state.goals.filter(x=>!x.done);save();render()};if(el('import'))el('import').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!data||!Array.isArray(data.goals)||!Array.isArray(data.gear)||!Array.isArray(data.saved))throw Error('Invalid backup');if(!confirm('Replace local progress with this backup?'))return;state={...defaults,...data,learned:Array.isArray(data.learned)?data.learned:[]};save();render()}catch{alert('Invalid Forever Companion backup. No changes made.')}};if(el('export'))el('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='forever-companion-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}}
render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script></body></html>
