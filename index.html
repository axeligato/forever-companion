<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#141414"/><meta name="description" content="A pocket companion for WoW Forever adventures."/><title>Forever Companion</title><link rel="manifest" href="/manifest.webmanifest"/><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#eee9dd;background:#111214;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #e7b968;outline-offset:2px}.shell{max-width:560px;margin:auto;min-height:100dvh;padding:24px 20px 110px}.eyebrow{font-size:11px;letter-spacing:.16em;color:#c4a46b;text-transform:uppercase;font-weight:700}h1{font-family:Georgia,serif;font-size:32px;font-weight:500;margin:10px 0 8px}h2{font-size:17px;margin:28px 0 12px}p{color:#a7a7a7;line-height:1.5}.muted{color:#a7a7a7;font-size:13px}.card{background:#1d1e20;border:1px solid #343332;border-radius:16px;padding:18px;margin:12px 0}.hero{background:linear-gradient(125deg,#29251d,#1d1e20 65%)}.pill{display:inline-block;background:#373026;color:#f0cb86;border-radius:30px;padding:5px 10px;font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:grid;gap:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:13px;border:1px solid #383737;border-radius:12px}.stat b{display:block;font-size:21px;margin-top:5px}input,select{width:100%;background:#262729;color:#f2eee6;border:1px solid #474542;border-radius:10px;padding:12px;min-width:0}label{font-size:12px;color:#c8c0b2;display:grid;gap:6px}button{background:#d7ad69;color:#191714;border:0;border-radius:10px;padding:11px 14px;font-weight:700}button.secondary{background:#303031;color:#eee7dc}button.ghost{background:transparent;color:#d9b677;padding:7px}.actions{display:flex;gap:8px;flex-wrap:wrap}.item{display:flex;gap:12px;align-items:center;border-bottom:1px solid #353536;padding:12px 0}.item:last-child{border-bottom:0}.item-main{flex:1;min-width:0}.item strong{display:block;font-size:14px}.item small{display:block;color:#a9a5a0;margin-top:4px}.check{width:20px;height:20px;accent-color:#d7ad69;flex-shrink:0}.nav{position:fixed;bottom:0;left:0;right:0;background:#1b1c1ef2;border-top:1px solid #3b3936;display:flex;justify-content:center;padding:10px 8px max(12px,env(safe-area-inset-bottom));z-index:5}.nav-inner{width:min(560px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.nav button{background:none;color:#9e9b95;padding:8px 3px;font-size:12px;font-weight:500}.nav button.active{color:#f2c981;background:#373127}.nav span{display:block;font-size:21px;margin-bottom:4px}.empty{padding:24px;text-align:center;border:1px dashed #55514a;border-radius:14px;color:#aaa}footer{margin-top:35px;text-align:center;font-size:11px;color:#797979}@media(min-width:700px){.shell{padding-top:40px}}
</style></head><body><main class="shell" id="app"></main><nav class="nav" aria-label="Main navigation"><div class="nav-inner" id="nav"></div></nav><script>
const KEY='forever-companion-v1';const defaults={name:'My Champion',class:'Paladin',spec:'Protection',level:38,profession:'Blacksmithing',skill:185,goals:[{id:1,text:'Review blacksmithing recipes',done:false},{id:2,text:'Collect materials for next upgrade',done:false}],gear:[],saved:[]};let state;try{state={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state={...defaults}}let tab='home',filter='';const recipes=[{id:'demo-1',name:'Example: Defensive Belt',profession:'Blacksmithing',skill:150,mats:'Iron Bar × 8, Heavy Leather × 2'},{id:'demo-2',name:'Example: Reinforced Boots',profession:'Blacksmithing',skill:180,mats:'Steel Bar × 10, Heavy Leather × 4'},{id:'demo-3',name:'Example: Heavy Shield',profession:'Blacksmithing',skill:200,mats:'Mithril Bar × 12, Solid Stone × 4'}];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const el=id=>document.getElementById(id);const icon={home:'⌂',craft:'⚒',gear:'◇',goals:'☑'};function render(){el('nav').innerHTML=Object.entries(icon).map(([k,v])=>'<button class="'+(tab===k?'active':'')+'" data-tab="'+k+'"><span>'+v+'</span>'+k[0].toUpperCase()+k.slice(1)+'</button>').join('');let content=tab==='home'?home():tab==='craft'?craft():tab==='gear'?gear():goals();el('app').innerHTML='<div class="eyebrow">Forever Companion · V1</div>'+content+'<footer>Unofficial fan-made companion · Not affiliated with Blizzard or WoW Forever</footer>';document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});bind()}
function home(){const completed=state.goals.filter(x=>x.done).length;return '<h1>Your adventure</h1><p>A little clarity before your next session.</p><section class="card hero"><div class="row"><div><span class="pill">'+esc(state.spec)+' '+esc(state.class)+'</span><h2 style="font-family:Georgia,serif;font-size:25px;margin:15px 0 5px">'+esc(state.name)+'</h2><span class="muted">Level '+esc(state.level)+' · '+esc(state.profession)+'</span></div><div style="font-size:52px;color:#d9b677">♜</div></div></section><div class="grid"><div class="stat"><span class="muted">Profession skill</span><b>'+esc(state.skill)+'</b></div><div class="stat"><span class="muted">Goals complete</span><b>'+completed+' / '+state.goals.length+'</b></div></div><h2>Character details</h2><div class="card"><div class="grid"><label>Character name<input id="name" maxlength="40" value="'+esc(state.name)+'"></label><label>Level<input id="level" type="number" min="1" max="100" value="'+esc(state.level)+'"></label><label>Class<select id="class">'+['Paladin','Warrior','Druid','Shaman','Hunter','Rogue','Mage','Priest','Warlock'].map(x=>'<option '+(x===state.class?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label>Specialization<input id="spec" maxlength="40" value="'+esc(state.spec)+'"></label><label>Profession<select id="profession">'+['Blacksmithing','Alchemy','Engineering','Leatherworking','Tailoring','Enchanting','Jewelcrafting','Mining','Herbalism','Skinning'].map(x=>'<option '+(x===state.profession?'selected':'')+'>'+x+'</option>').join('')+'</select></label><label>Skill<input id="skill" type="number" min="0" max="450" value="'+esc(state.skill)+'"></label></div><p class="muted">Changes save automatically on this device.</p></div><h2>Up next</h2>'+goalItems(state.goals.slice(0,3))+'<button class="secondary" id="goGoals">See all goals →</button>'}
function craft(){const matches=recipes.filter(r=>r.profession===state.profession&&r.name.toLowerCase().includes(filter.toLowerCase()));return '<h1>Profession planner</h1><p>Browse example recipes, save patterns, and keep material lists handy.</p><div class="card"><strong>Demo data only</strong><p class="muted">These recipes are fictional UI examples, not verified WoW Forever patterns or recommendations.</p><label>Search recipes<input id="search" placeholder="Search patterns…" value="'+esc(filter)+'"></label></div><div class="row"><h2>'+esc(state.profession)+'</h2><span class="muted">'+matches.length+' examples</span></div>'+(matches.length?matches.map(r=>'<div class="card"><div class="row"><strong>'+esc(r.name)+'</strong><span class="pill">Skill '+r.skill+'</span></div><p class="muted">Materials: '+esc(r.mats)+'</p><button class="'+(state.saved.includes(r.id)?'secondary':'')+'" data-recipe="'+r.id+'">'+(state.saved.includes(r.id)?'✓ Saved':'Save pattern')+'</button></div>').join(''):'<div class="empty">No example recipes for this selection. Real server data can be added later.</div>')}
function gear(){return '<h1>Gear wishlist</h1><p>Keep track of items you want to craft, farm or purchase.</p><form id="gearForm" class="card stack"><label>Item name<input name="item" maxlength="90" required placeholder="e.g. A new tank shield"></label><label>Where to get it (optional)<input name="source" maxlength="120" placeholder="Dungeon, vendor, crafting…"></label><button>Add item</button></form><h2>Wishlist · '+state.gear.length+'</h2>'+(state.gear.length?state.gear.map(x=>'<div class="card row"><div class="item-main"><strong>'+esc(x.name)+'</strong><small class="muted">'+esc(x.source||'Source not specified')+' · '+(x.done?'Acquired':'Wanted')+'</small></div><button class="secondary" data-gear="'+x.id+'">'+(x.done?'Undo':'Got it')+'</button><button class="ghost" aria-label="Remove item" data-removegear="'+x.id+'">✕</button></div>').join(''):'<div class="empty">Your wishlist is empty. Add your first upgrade above.</div>')}
function goalItems(items){return items.length?'<div class="card">'+items.map(x=>'<div class="item"><input class="check" aria-label="Complete goal" type="checkbox" data-goal="'+x.id+'" '+(x.done?'checked':'')+'><div class="item-main"><strong style="'+(x.done?'text-decoration:line-through;opacity:.55':'')+'">'+esc(x.text)+'</strong></div><button class="ghost" aria-label="Delete goal" data-removegoal="'+x.id+'">✕</button></div>').join('')+'</div>':'<div class="empty">No goals yet.</div>'}
function goals(){return '<h1>Session goals</h1><p>Plan what matters for your next adventure.</p><form id="goalForm" class="card stack"><label>New objective<input name="goal" maxlength="120" required placeholder="e.g. Visit blacksmithing vendor"></label><button>Add objective</button></form><h2>Your checklist</h2>'+goalItems(state.goals)+'<div class="actions"><button class="secondary" id="clearDone">Clear completed</button><button class="ghost" id="export">Export my data</button></div>'}
function bind(){['name','class','spec','profession','level','skill'].forEach(k=>{if(el(k))el(k).onchange=e=>{state[k]=['level','skill'].includes(k)?Math.max(0,Number(e.target.value)||0):e.target.value;save();render()}});if(el('goGoals'))el('goGoals').onclick=()=>{tab='goals';render()};if(el('search'))el('search').oninput=e=>{filter=e.target.value;const pos=e.target.selectionStart;render();el('search').focus();el('search').setSelectionRange(pos,pos)};document.querySelectorAll('[data-recipe]').forEach(b=>b.onclick=()=>{let id=b.dataset.recipe;state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];save();render()});if(el('gearForm'))el('gearForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);state.gear.push({id:Date.now(),name:String(f.get('item')).trim(),source:String(f.get('source')).trim(),done:false});save();render()};if(el('goalForm'))el('goalForm').onsubmit=e=>{e.preventDefault();const value=String(new FormData(e.target).get('goal')).trim();if(value){state.goals.push({id:Date.now(),text:value,done:false});save();render()}};document.querySelectorAll('[data-goal]').forEach(b=>b.onchange=()=>{const x=state.goals.find(x=>x.id==b.dataset.goal);if(x)x.done=b.checked;save();render()});document.querySelectorAll('[data-removegoal]').forEach(b=>b.onclick=()=>{state.goals=state.goals.filter(x=>x.id!=b.dataset.removegoal);save();render()});document.querySelectorAll('[data-gear]').forEach(b=>b.onclick=()=>{const x=state.gear.find(x=>x.id==b.dataset.gear);if(x)x.done=!x.done;save();render()});document.querySelectorAll('[data-removegear]').forEach(b=>b.onclick=()=>{state.gear=state.gear.filter(x=>x.id!=b.dataset.removegear);save();render()});if(el('clearDone'))el('clearDone').onclick=()=>{state.goals=state.goals.filter(x=>!x.done);save();render()};if(el('export'))el('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='forever-companion-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}}
render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script></body></html>
